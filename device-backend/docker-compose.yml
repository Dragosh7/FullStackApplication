version: '3'

services:
  db:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'device-db'
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      - "3308:3306"
    volumes:
      - my-db:/var/lib/mysql
    networks:
      demo_net:
  device-backend:
    container_name: device-backend
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - "8081:8081"
    environment:
      - DB_IP=db
      - DB_PORT=3308
      - DB_DBNAME=device-db
      - DB_USER=root
      - DB_PASSWORD=root
    networks:
      demo_net:
        ipv4_address: 172.30.0.2

volumes:
  my-db:

networks:
  demo_net:
    external: true
