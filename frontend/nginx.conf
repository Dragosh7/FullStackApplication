server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;  # Ensure this path is correct
        index index.html;
        try_files $uri $uri/ /index.html;  # Serve index.html for SPA
    }

    error_page 404 /index.html;  # Redirect 404 errors to index.html
}
